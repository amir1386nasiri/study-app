<style>

</style></head><body data-t="o"><header><b>📚 دستیار درسی</b><div class=dots><span style="background:#f97316" onclick="th('o')"></span><span style="background:#2563eb" onclick="th('b')"></span><span style="background:#16a34a" onclick="th('g')"></span></div></header>
<main id=m></main><nav id=nv></nav><div id=md onclick="if(event.target==this)cl()"></div>
<script>
const $=s=>document.querySelector(s),P=n=>String(n).padStart(2,'0'),fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const SUB=['زیست','شیمی','فیزیک','ریاضی','زمین','سایر'],TYP=['تست','ویدیو','مطالعه یا مرور','سایر'],TC=['#dbeafe','#ede9fe','#dcfce7','#f1f5f9'],ST=['انجام‌نشده','نیمه‌کاره','انجام‌شده'];

const qt=i=>`<div class=q><b>💬 جمله انگیزشی</b>${QT[(i+new Date().getDate())%QT.length]}</div>`;
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];let y2=gm>2?gy+1:gy,d=355666+365*gy+Math.floor((y2+3)/4)-Math.floor((y2+99)/100)+Math.floor((y2+399)/400)+gd+g[gm-1],jy=-1595+33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;if(d>365){jy+=Math.floor((d-1)/365);d=(d-1)%365}return[jy,d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),1+(d<186?d%31:(d-186)%30)]}

const iso=d=>d.getFullYear()+'-'+P(d.getMonth()+1)+'-'+P(d.getDate()),T0=()=>iso(new Date()),sp=s=>s.split('-').map(Number);

const V_={
today(){const t=T0(),L=S.tasks.filter(x=>x.d==t),o=S.tasks.filter(x=>x.d<t&&x.st!=2),dn=L.filter(x=>x.st==2).length;return`<h2>${wd(t)} ${jf(t)}</h2>${qt(0)}<div class=bar><i style="width:${L.length?dn/L.length*100:0}%"></i></div><p class=sm>${fa(dn)} از ${fa(L.length)} کار امروز انجام شد</p>${o.length?'<h3>⏰ عقب‌افتاده</h3>'+o.map(tc).join(''):''}<h3>کارهای امروز</h3>${L.map(tc).join('')||'<p class=sm>کاری برای امروز ثبت نشده.</p>'}${fab}`},

exam(){const E=[...S.exams].sort((a,b)=>a.d<b.d?-1:1),av=E.length?Math.round(E.reduce((a,e)=>a+e.p,0)/E.length*10)/10:0;return`<h2>📝 آزمون‌ها</h2>${qt(3)}<div class=card>میانگین درصد: <b>${fa(av)}٪</b> · تعداد آزمون: ${fa(E.length)}</div>${chart(E)}<h3>🧭 مشاوره هوشمند</h3><div class=card>${adv()}</div><h3>سوابق</h3>${[...E].reverse().map(e=>`<div class=card><b>${SUB[e.su]} ← ${esc(e.tp)}</b><div class=sm>${jf(e.d)} · کل ${fa(e.n)} · درست ${fa(e.c)} · غلط ${fa(e.w)} · درصد ${fa(e.p)}٪</div><div class=row><button onclick=ef(${e.id})>✏️</button><button onclick=ed(${e.id})>🗑</button></div></div>`).join('')}<div class=row><button onclick=ecv()>📤 خروجی CSV</button></div><button class=fab onclick=ef()>＋</button>`},

function rl(){const m=R.r,f=m==999?'0000':add(T0(),-m);return S.tasks.filter(x=>x.d>=f&&x.d<=T0())}
function wk(){const t=T0(),D=[6,5,4,3,2,1,0].map(i=>add(t,-i)),n=D.map(d=>S.tasks.filter(x=>x.d==d&&x.st==2).length),mx=Math.max(1,...n);return`<div style="display:flex;gap:6px;align-items:flex-end;height:90px">${D.map((d,i)=>`<div style="flex:1;text-align:center;font-size:10px"><div style="background:var(--p);height:${n[i]/mx*70}px;border-radius:5px"></div>${fa(n[i])}<br>${jf(d).slice(5)}</div>`).join('')}</div>`}

function ef(id){const e=S.exams.find(x=>x.id==id)||{su:0,tp:'',d:T0(),n:'',c:'',w:'',p:''};md(`<h3>${id?'ویرایش آزمون':'آزمون جدید'}</h3><label>تاریخ شمسی<input id=ed value="${jf(e.d)}"></label><select id=es onchange=tpo()>${op(SUB,e.su)}</select><select id=et></select><input id=en type=number placeholder="کل تست‌ها" value="${e.n}" oninput=ep()><input id=ec type=number placeholder="درست" value="${e.c}" oninput=ep()><input id=ew type=number placeholder="غلط" value="${e.w}" oninput=ep()><label>درصد (خودکار با نمره منفی؛ قابل ویرایش)<input id=ep type=number step=0.1 value="${e.p}"></label><button class=pri onclick=es_(${id||0})>ذخیره</button>`);tpo(e.tp)}

function ep(){$('#ep').value=pct(+$('#en').value,+$('#ec').value,+$('#ew').value)}
function es_(id){const d=pj($('#ed').value),n=+$('#en').value;if(!d||!n)return alert('تاریخ و تعداد کل را وارد کن');const o={d,su:+$('#es').value,tp:$('#et').value,n,c:+$('#ec').value,w:+$('#ew').value,p:+$('#ep').value};if(id)Object.assign(S.exams.find(x=>x.id==id),o);else S.exams.push({...o,id:rid()});save();cl()}
function ed(id){if(confirm('حذف شود؟')){S.exams=S.exams.filter(x=>x.id!=id);save();render()}}
function chart(E){if(E.length<2)return'';const w=320,h=120,pts=E.map((e,i)=>[10+i*(w-20)/(E.length-1),h-10-Math.max(0,Math.min(100,e.p))/100*(h-20)]);return`<svg viewBox="0 0 ${w} ${h}"><polyline fill=none stroke="var(--p)" stroke-width=3 points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map(p=>`<circle cx=${p[0]} cy=${p[1]} r=4 fill="var(--pd)"/>`).join('')}</svg>`}
function adv(){if(!S.exams.length)return'برای دریافت مشاوره، چند آزمون ثبت کن.';const m={};S.exams.forEach(e=>{const k=SUB[e.su]+' ← '+e.tp;(m[k]=m[k]||[]).push(e.p)});const r=Object.entries(m).map(([k,v])=>[k,v.reduce((a,b)=>a+b,0)/v.length]).sort((a,b)=>a[1]-b[1]);const E=[...S.exams].sort((a,b)=>a.d<b.d?-1:1),l=E.slice(-1)[0],tr=E.length>1?l.p-E[E.length-2].p:0,wr=S.exams.reduce((a,e)=>a+e.w,0)/Math.max(1,S.exams.reduce((a,e)=>a+e.n,0));return r.slice(0,3).map(([k,v])=>`<p>• <b>${k}</b> (میانگین ${fa(Math.round(v))}٪): ${v<30?'از مفاهیم پایه شروع کن؛ ویدیو + مطالعه، بعد ۲۰ تست آسان.':v<60?'خلاصه‌نویسی، تست تیپ‌بندی‌شده و بررسی دلیل غلط‌ها.':'با مرور هفتگی و تست زمان‌دار سطح را حفظ کن.'}</p>`).join('')+`<p class=sm>${E.length>1?(tr>=0?'📈 روند آخرین آزمون صعودی بود، ادامه بده!':'📉 آخرین آزمون افت داشت؛ مباحث بالا را در اولویت بگذار.'):''}${wr>.25?' ⚠️ درصد غلط بالاست؛ سؤال مشکوک را نزن.':''}</p>`}
function ha(){const n=prompt('نام عادت؟');if(n){S.habits.push({id:rid(),n,k:{}});save();render()}}
const hb=(id,d)=>{const h=S.habits.find(x=>x.id==id);h.k[d]?delete h.k[d]:h.k[d]=1;save();render()},hr=id=>{const h=S.habits.find(x=>x.id==id),n=prompt('نام جدید',h.n);if(n){h.n=n;save();render()}},hx=id=>{if(confirm('حذف شود؟')){S.habits=S.habits.filter(x=>x.id!=id);save();render()}};
function kdset(){const v=prompt('تاریخ کنکور (شمسی، مثل ۱۴۰۶/۰۴/۱۵)',S.kd?jf(S.kd):'');const d=v&&pj(v);if(d){S.kd=d;save();render()}}
function pc(){$('#pr').textContent=fa(pct(+$('#pn').value,+$('#pc').value,+$('#pw2').value))+'٪'}
let TM={s:0,i:null,lab:'',nx:0};
function tmS(sec,lab,nx){clearInterval(TM.i);TM={s:sec,lab,nx,i:setInterval(tick,1000)};tick(1)}
function tick(f){if(!f)TM.s--;const e=$('#tm'),s=Math.max(TM.s,0);if(e)e.textContent=TM.lab+' '+fa(P(Math.floor(s/60))+':'+P(s%60));if(TM.s<=0&&!f){clearInterval(TM.i);navigator.vibrate&&navigator.vibrate([500,200,500]);notify('پایان '+TM.lab);if(TM.nx)tmS(TM.nx*60,'استراحت',0)}}
function imp(i){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render();alert('بازیابی شد')}catch(e){alert('فایل نامعتبر')}};r.readAsText(i.files[0])}
const TABS=[['today','امروز','🏠'],['cal','تقویم','📅'],['rep','گزارش','📊'],['exam','آزمون','📝'],['hab','عادت','🔥'],['tool','ابزار','🧰']];
function render(){document.body.dataset.t=S.th;$('#m').innerHTML=V_[V]();$('#nv').innerHTML=TABS.map(t=>`<div class="${V==t[0]?'on':''}" onclick="V='${t[0]}';render()"><span>${t[2]}</span>${t[1]}</div>`).join('');if(V=='rep')draw()}
render();S.tasks.forEach(t=>t.st<2&&sched(t));
</script></body></html>
