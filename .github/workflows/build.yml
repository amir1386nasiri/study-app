name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - name: Persian font (Vazirmatn)
        run: |
          npm i vazirmatn --no-save
          mkdir -p www/fonts
          F=$(find node_modules/vazirmatn -iname '*wght*.woff2' | head -1)
          [ -z "$F" ] && F=$(find node_modules/vazirmatn -name '*.woff2' | head -1)
          cp "$F" www/fonts/Vazirmatn.woff2
      - run: npx cap add android
      - name: Permissions
        run: sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: app-debug, path: android/app/build/outputs/apk/debug/app-debug.apk}
